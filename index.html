<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doraemon Toy Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1e90ff;
      color: white;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin: 0;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px;
    }
    .gallery img {
      margin: 10px;
      border: 3px solid #1e90ff;
      border-radius: 10px;
      width: 200px;
      height: auto;
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.1);
    }
    footer {
      background-color: #1e90ff;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to Doraemon Toy Store</h1>
    <p>Your favorite Doraemon toys are here!</p>
  </header>

  <section class="gallery">
    <img src="https://upload.wikimedia.org/wikipedia/en/0/0d/Doraemon_character.png" alt="Doraemon Toy 1">
    <img src="https://i.pinimg.com/originals/5a/7d/0b/5a7d0b8b6f7f6f8c6f3f9b6a5a7d0b8b.jpg" alt="Doraemon Toy 2">
    <img src="https://i.pinimg.com/originals/2a/3d/7f/2a3d7f8c6f3f9b6a5a7d0b8b6f7f6f8c.jpg" alt="Doraemon Toy 3">
  </section>

  <footer>
    <p>&copy; 2026 Doraemon Toy Store. All rights reserved.</p>
  </footer>
</body>
</html>
